{% extends 'base.html' %}
{% block content %}
<section class="auth-section"><div class="auth-card"><span class="eyebrow">Join the store</span><h1>Create an account</h1><p>Make a demo account to place a sample order.</p><form method="post" action="{{ url_for('register') }}" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input type="text" name="name" autocomplete="name" maxlength="100" required></label><label>Email address<input type="email" name="email" autocomplete="email" maxlength="254" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label><button class="button button-primary button-wide" type="submit">Create account</button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></section>
{% endblock %}
