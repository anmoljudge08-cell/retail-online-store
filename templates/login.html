{% extends 'base.html' %}
{% block content %}
<section class="auth-section"><div class="auth-card"><span class="eyebrow">Welcome back</span><h1>Log in</h1><p>Sign in to continue to demo checkout.</p><form method="post" action="{{ url_for('login') }}" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button button-primary button-wide" type="submit">Log in</button></form><p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>
{% endblock %}
